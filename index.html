<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Taylor Ritchie's portfolio is being rebuilt. Contact Taylor, view LinkedIn, or download a resume.">
  <meta name="theme-color" content="#172022">
  <link rel="canonical" href="https://tayloraritchie.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Taylor Ritchie · Site under construction">
  <meta property="og:description" content="Taylor's portfolio is being rebuilt. Get in touch, view LinkedIn, or download a resume.">
  <meta property="og:url" content="https://tayloraritchie.com/">
  <title>Taylor Ritchie · Site under construction</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #172022;
      --paper: #f7f4ec;
      --mist: #c9d3cf;
      --accent: #d9a441;
      --line: rgba(247, 244, 236, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      background:
        radial-gradient(circle at 18% 12%, rgba(217, 164, 65, 0.18), transparent 29rem),
        radial-gradient(circle at 86% 88%, rgba(110, 145, 135, 0.22), transparent 31rem),
        var(--ink);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main { width: min(100%, 44rem); }

    .label {
      margin: 0 0 1.5rem;
      color: var(--accent);
      font: 700 0.78rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(3.2rem, 11vw, 7.5rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.9;
    }

    .message {
      max-width: 39rem;
      margin: 2rem 0 2.5rem;
      color: var(--mist);
      font: 400 clamp(1.1rem, 2.4vw, 1.35rem)/1.6 system-ui, sans-serif;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--line);
    }

    a {
      min-height: 2.8rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      border: 1px solid var(--line);
      color: var(--paper);
      font: 700 0.9rem/1.2 system-ui, sans-serif;
      text-decoration: none;
    }

    a:hover { border-color: var(--accent); color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

    .note {
      margin: 2.5rem 0 0;
      color: var(--mist);
      font: 400 0.875rem/1.5 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Taylor Ritchie</p>
    <h1>Under construction.</h1>
    <p class="message">I’m rebuilding this portfolio. In the meantime, you can reach me, connect on LinkedIn, or download my résumé below.</p>
    <nav class="actions" aria-label="Contact and resume links">
      <a href="mailto:taylor.ritchie14@gmail.com">Email Taylor</a>
      <a href="https://www.linkedin.com/in/taylor-askew-ritchie-126618133">LinkedIn</a>
      <a href="resume/TaylorRitchie_Resume.pdf">Download résumé</a>
    </nav>
    <p class="note">Thanks for stopping by.</p>
  </main>
</body>
</html>
